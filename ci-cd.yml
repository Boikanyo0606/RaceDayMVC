name: RaceDay MVC CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDayMVC/RaceDayMVC.csproj

    - name: Build the project
      run: dotnet build RaceDayMVC/RaceDayMVC.csproj --no-restore --configuration Release

    - name: Run Tests (if any)
      run: dotnet test RaceDayMVC/RaceDayMVC.csproj --no-build --verbosity normal

    - name: Publish for Docker
      run: dotnet publish RaceDayMVC/RaceDayMVC.csproj -c Release -o ./publish
